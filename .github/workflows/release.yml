name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the v (e.g. 0.1.0).'
        required: true
      publish:
        description: 'Also create tag v<version> on this commit and publish the GitHub Release. Off = build the zips as a workflow artifact only.'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Version
        shell: pwsh
        run: |
          $v = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}'.TrimStart('v') } else { '${{ inputs.version }}' }
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Invalid version '$v'" }
          $proj = ([xml](Get-Content src/SolidWorksMcp/SolidWorksMcp.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($proj -ne $v) { throw "Release version $v does not match <Version>$proj</Version> in SolidWorksMcp.csproj. Bump the csproj first." }
          "VERSION=$v" >> $env:GITHUB_ENV
      - run: dotnet test -c Release
      - name: Signing certificate
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_B64)) {
            $msg = 'SIGNING_CERT_PFX_BASE64 is not set: this release is NOT code-signed. See INSTALL.md (Code signing) to enable it.'
            "::warning title=Unsigned release::$msg"
            "> [!WARNING]`n> $msg" >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          $path = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:PFX_B64.Trim()))
          "SIGNING_CERT_PATH=$path" >> $env:GITHUB_ENV
      - name: Package
        shell: pwsh
        env:
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          $pkg = @{ Version = $env:VERSION }
          if ($env:SIGNING_CERT_PATH) { $pkg.SigningCertPath = $env:SIGNING_CERT_PATH; $pkg.TrustOnThisMachine = $true }
          ./build/package.ps1 @pkg
      - name: Remove signing certificate
        if: always()
        shell: pwsh
        run: if ($env:SIGNING_CERT_PATH) { Remove-Item $env:SIGNING_CERT_PATH -Force -ErrorAction SilentlyContinue }
      - name: Smoke test (self-contained)
        shell: pwsh
        run: ./build/smoke-test.ps1 -Exe "artifacts/solidworks-mcp-$env:VERSION-win-x64/SolidWorksMcp.exe" -ExpectedVersion $env:VERSION
      - name: Smoke test (framework-dependent)
        shell: pwsh
        run: ./build/smoke-test.ps1 -Exe "artifacts/solidworks-mcp-$env:VERSION-win-x64-framework/SolidWorksMcp.exe" -ExpectedVersion $env:VERSION
      - uses: actions/upload-artifact@v7
        with:
          name: solidworks-mcp-${{ env.VERSION }}
          path: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
            artifacts/SolidWorksMcp-signing.cer
          if-no-files-found: error
      - name: GitHub Release
        if: github.ref_type == 'tag' || inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # On a manual run the tag does not exist yet: gh creates v<version> on the commit this run built.
          $tag = "v$env:VERSION"
          $notes = Join-Path $env:RUNNER_TEMP 'notes.md'
          $assets = @((Get-ChildItem artifacts/*.zip).FullName) + 'artifacts/SHA256SUMS.txt'
          $body = Get-Content docs/RELEASE_NOTES.md -Raw
          if (Test-Path artifacts/signing-thumbprint.txt) {
            $thumb = Get-Content artifacts/signing-thumbprint.txt -Raw
            $assets += 'artifacts/SolidWorksMcp-signing.cer'
            $body += "`n## Code signing`n`n``SolidWorksMcp.exe`` is signed with the project's **self-signed, internal** certificate (SHA-256, timestamped). Thumbprint: ``$thumb``. Windows shows it as untrusted until IT deploys ``SolidWorksMcp-signing.cer``; see ``INSTALL.md``.`n"
          } else {
            $body += "`n## Code signing`n`nThis release is **not code-signed**.`n"
          }
          Set-Content $notes $body -Encoding utf8
          gh release create $tag @assets `
            --target '${{ github.sha }}' --title "SolidWorks MCP $env:VERSION" --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
